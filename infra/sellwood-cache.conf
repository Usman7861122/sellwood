# Sellwood: browser cache headers. Include inside the HTTPS server{} block, AFTER the redirects include:
#   include /etc/nginx/snippets/sellwood-cache.conf;
# add_header inside a location hides the server-level headers, so the security snippet is included again.

# Hashed build files never change: cache for one year.
location ^~ /_astro/ {
    include /etc/nginx/snippets/sellwood-sec.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Images, video, fonts and old WordPress uploads: cache for 30 days.
location ~* ^/(images|video|fonts|wp-content)/ {
    include /etc/nginx/snippets/sellwood-sec.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}
